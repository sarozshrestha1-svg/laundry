<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumla Laundry - Hotel Laundry Record</title>
    <style>
      :root {
        --brand: #0f766e;
        --brand-dark: #134e4a;
        --ink: #10201f;
        --muted: #5f7471;
        --line: #dbe7e4;
        --soft: #eef7f4;
        --page: #f8fbfa;
        --white: #ffffff;
        --danger: #b42318;
        --success: #067647;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--page);
        color: var(--ink);
      }

      main {
        width: min(100%, 520px);
        min-height: 100vh;
        margin: 0 auto;
        background: var(--white);
      }

      header {
        padding: 28px 20px 22px;
        background: var(--brand-dark);
        color: var(--white);
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        opacity: 0.8;
      }

      h1 {
        margin: 0;
        font-size: 27px;
        line-height: 1.16;
        letter-spacing: 0;
      }

      .panel {
        padding: 20px;
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 15px;
        font-weight: 750;
      }

      input,
      select,
      textarea,
      button {
        width: 100%;
        font: inherit;
      }

      input,
      select,
      textarea {
        min-height: 56px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 15px;
        background: #fbfdfc;
        color: var(--ink);
        font-size: 17px;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
        outline: none;
      }

      .hotel-card {
        display: grid;
        gap: 4px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      .hotel-card span {
        color: var(--muted);
        font-size: 14px;
      }

      .actions {
        position: sticky;
        bottom: 0;
        margin: 10px -20px -20px;
        padding: 14px 20px 20px;
        background: rgba(255, 255, 255, 0.95);
        border-top: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }

      button {
        min-height: 60px;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: var(--white);
        font-size: 17px;
        font-weight: 800;
        cursor: pointer;
      }

      button:active {
        transform: translateY(1px);
      }

      button[disabled] {
        cursor: wait;
        opacity: 0.72;
      }

      .status {
        min-height: 22px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.35;
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: var(--success);
      }

      @media (min-width: 700px) {
        body {
          padding: 32px 0;
        }

        main {
          min-height: auto;
          border: 1px solid var(--line);
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 20px 60px rgba(16, 32, 31, 0.08);
        }

        .actions {
          position: static;
          margin-top: 4px;
          border: 0;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Jumla Laundry</p>
        <h1>Hotel Laundry Record</h1>
      </header>

      <section class="panel">
        <form id="hotelLaundryForm">
          <label>
            Hotel name
            <select id="hotelName" name="Hotel Name" required>
              <option value="Hotel Pauwa">Hotel Pauwa</option>
              <option value="Hotel Royal Karnali Paradise">
                Hotel Royal Karnali Paradise
              </option>
              <option value="Kanjirowa Hotel">Kanjirowa Hotel</option>
            </select>
          </label>

          <div class="hotel-card" aria-live="polite">
            <strong id="selectedHotel">Hotel Pauwa</strong>
            <span>WhatsApp: <span id="hotelPhone">9868577513</span></span>
          </div>

          <label>
            Date
            <input id="recordDate" name="Date" type="date" required />
          </label>

          <label>
            Laundry weight in KG
            <input
              id="weightKg"
              name="Weight in KG"
              type="number"
              inputmode="decimal"
              min="0.1"
              step="0.1"
              placeholder="Example: 12.5"
              required
            />
          </label>

          <label>
            Note
            <textarea
              id="note"
              name="Note"
              placeholder="Optional note"
            ></textarea>
          </label>

          <div class="actions">
            <button id="submitButton" type="submit">
              Save &amp; Send WhatsApp Message
            </button>
            <p id="status" class="status"></p>
          </div>
        </form>
      </section>
    </main>

    <script>
      const scriptURL =
        "https://script.google.com/macros/s/AKfycby0iKRbhuV241M3vPJck5PIzqtnG6ihNm3ocRTLsVc30HTtaS5MKuUeWxbewswznAQ/exec";

      const hotels = {
        "Hotel Pauwa": {
          phone: "9868577513",
          sheet: "Hotel Pauwa",
        },
        "Hotel Royal Karnali Paradise": {
          phone: "9848313550",
          sheet: "Hotel Royal Karnali Paradise",
        },
        "Kanjirowa Hotel": {
          phone: "9858320533",
          sheet: "Kanjirowa Hotel",
        },
      };

      const form = document.getElementById("hotelLaundryForm");
      const hotelName = document.getElementById("hotelName");
      const selectedHotel = document.getElementById("selectedHotel");
      const hotelPhone = document.getElementById("hotelPhone");
      const recordDate = document.getElementById("recordDate");
      const weightKg = document.getElementById("weightKg");
      const note = document.getElementById("note");
      const statusText = document.getElementById("status");
      const submitButton = document.getElementById("submitButton");

      function getTodayDateValue() {
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        return new Date(now.getTime() - offset).toISOString().slice(0, 10);
      }

      function updateHotelDisplay() {
        const hotel = hotels[hotelName.value];
        selectedHotel.textContent = hotelName.value;
        hotelPhone.textContent = hotel.phone;
      }

      function setStatus(message, type = "") {
        statusText.textContent = message;
        statusText.className = `status ${type}`.trim();
      }

      function buildWhatsAppMessage(hotel, date, weight) {
        return `Namaste ${hotel},\nOn ${date}, your laundry weight is ${weight} KG.\nThank you,\nJumla Laundry`;
      }

      function openWhatsApp(phone, message) {
        const cleanPhone = phone.replace(/\D/g, "");
        const url = `https://wa.me/977${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.location.href = url;
      }

      hotelName.addEventListener("change", updateHotelDisplay);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const hotel = hotelName.value;
        const hotelInfo = hotels[hotel];
        const date = recordDate.value;
        const weight = weightKg.value.trim();

        if (!hotelInfo || !date || !weight || Number(weight) <= 0) {
          setStatus("Please enter hotel, date, and weight.", "error");
          return;
        }

        submitButton.disabled = true;
        setStatus("Saving record...");

        const createdAt = new Date().toISOString();
        const data = new FormData();
        data.append("Record Type", "Hotel Laundry");
        data.append("Date", date);
        data.append("Hotel Name", hotel);
        data.append("Weight in KG", weight);
        data.append("WhatsApp Number", hotelInfo.phone);
        data.append("Note", note.value.trim());
        data.append("Created Timestamp", createdAt);
        data.append("Target Sheet", hotelInfo.sheet);

        try {
          await fetch(scriptURL, {
            method: "POST",
            body: data,
            mode: "no-cors",
          });

          setStatus("Saved. Opening WhatsApp...", "success");
          openWhatsApp(hotelInfo.phone, buildWhatsAppMessage(hotel, date, weight));
          form.reset();
          recordDate.value = getTodayDateValue();
          updateHotelDisplay();
        } catch (error) {
          setStatus(
            "Could not save to Google Sheets. Please check the Apps Script connection.",
            "error",
          );
          submitButton.disabled = false;
        }
      });

      recordDate.value = getTodayDateValue();
      updateHotelDisplay();
    </script>
  </body>
</html>
